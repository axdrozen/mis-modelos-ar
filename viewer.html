<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pretty sourdough loaf · Vista 3D</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
      main { width: min(100%, 60rem); padding: 1rem; text-align: center; }
      model-viewer { width: 100%; height: min(72vh, 42rem); border-radius: 1rem; background: linear-gradient(#e2e8f0, #94a3b8); }
      a { color: #fbbf24; }
      p { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pretty sourdough loaf</h1>
      <p>Gira, acerca o aleja el modelo. Para fijarlo sobre el QR, vuelve a la experiencia de realidad aumentada.</p>
      <model-viewer
      src="https://raw.githubusercontent.com/axdrozen/mis-modelos-ar/main/pretty-sourdough-loaf.glb"
        alt="Modelo 3D de una hogaza de pan"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        ar
        ar-modes="webxr scene-viewer quick-look"
      ></model-viewer>
      <p><a href="index.html">Volver a realidad aumentada</a></p>
    </main>
  </body>
</html>
