<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>metro escaneado · Cubo AR</title>
  <script src="../../comlink.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#020617}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}
    #video,#ar{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
    #video{z-index:0;background:#020617}
    #ar{z-index:1;pointer-events:none}
    #panel{position:fixed;z-index:5;left:1rem;right:1rem;top:max(1rem,env(safe-area-inset-top));padding:1rem 1.1rem;border:1px solid #64748b66;border-radius:16px;background:#0f172ade;backdrop-filter:blur(8px);text-align:center;line-height:1.35;box-shadow:0 10px 30px #0005}
    #status{font-size:.98rem;color:#e2e8f0}
    #detail{margin-top:.35rem;color:#cbd5e1;font-size:.82rem}
    button{margin-top:.8rem;border:0;border-radius:999px;padding:.75rem 1.1rem;background:#f59e0b;color:#111827;font-weight:800;font-size:1rem}
    button:disabled{opacity:.6}
    #model-name{font-weight:800;color:#fbbf24}
    #loading{position:fixed;z-index:4;inset:0;display:grid;place-items:center;background:#020617;color:#cbd5e1}
    #loading[hidden]{display:none}
  </style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="ar"></canvas>
  <div id="loading">Preparando el visor 3D…</div>
  <section id="panel">
    <div id="status">Pulsa «Activar cámara» y apunta al cubo.</div>
    <div id="detail">La página reconoce seis etiquetas AprilTag y calcula una sola pose rígida del cubo para evitar saltos.</div>
    <button id="start" type="button">Activar cámara</button>
  </section>

  <script>
  (() => {
    const MODEL_NAME = "metro escaneado";
    const MODEL_URL = "modelo.glb";
    const MODEL_SCALE = Number("3.2680");
    const TAG_SIZE = 0.054;
    const CUBE_HALF = 0.03;
    const PROCESS_MAX = 960;
    const HOLD_MS = 260;
    const TAG_IDS = new Set([0, 1, 2, 3, 4, 5]);

    const video = document.getElementById("video");
    const canvas = document.getElementById("ar");
    const processingCanvas = document.createElement("canvas");
    const processingContext = processingCanvas.getContext("2d", {willReadFrequently:true});
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    const startButton = document.getElementById("start");
    const loading = document.getElementById("loading");

    const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true, powerPreference:"high-performance"});
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x667085, 2.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(1.5, 2.5, 2);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x9db7ff, 1.4);
    fillLight.position.set(-2, 1, -1.5);
    scene.add(fillLight);
    const camera = new THREE.Camera();
    camera.matrixAutoUpdate = false;
    scene.add(camera);

    const cubeRoot = new THREE.Group();
    cubeRoot.visible = false;
    scene.add(cubeRoot);
    const modelAnchor = new THREE.Group();
    // Este GLB conserva un desfase vertical de origen; se corrige solo aquí.
    modelAnchor.position.set(0, -CUBE_HALF - 0.035, 0);
    cubeRoot.add(modelAnchor);
    let modelScaleFactor = 1;
    const TOP_FACE_SCALE_FACTOR = 0.78;

    function updateModelScale(candidates) {
      // Solo este modelo necesita una compensación en la vista superior.
      const topFaceOnly = candidates.length === 1 && candidates[0].id === 4;
      const target = topFaceOnly ? TOP_FACE_SCALE_FACTOR : 1;
      modelScaleFactor += (target - modelScaleFactor) * 0.18;
      modelAnchor.scale.setScalar(modelScaleFactor);
    }

    let stream = null;
    let detector = null;
    let detectorReady = false;
    let processing = false;
    let lastFrameAt = performance.now();
    let lastSeenAt = 0;
    let filteredPosition = new THREE.Vector3();
    let filteredQuaternion = new THREE.Quaternion();
    let filterStarted = false;
    let lastVisibleCount = 0;

    const faceTransforms = [
      // Each entry maps a physical cube point to the tag coordinate system.
      // The tag y axis points down in its printed image and z points inward.
      {x:[1,0,0],   y:[0,-1,0], z:[0,0,-1], p:[0,0,CUBE_HALF]},
      {x:[0,0,-1],  y:[0,-1,0], z:[-1,0,0], p:[CUBE_HALF,0,0]},
      {x:[-1,0,0],  y:[0,-1,0], z:[0,0,1],  p:[0,0,-CUBE_HALF]},
      {x:[0,0,1],   y:[0,-1,0], z:[1,0,0],   p:[-CUBE_HALF,0,0]},
      {x:[1,0,0],   y:[0,0,1],  z:[0,-1,0],  p:[0,CUBE_HALF,0]},
      {x:[1,0,0],   y:[0,0,-1], z:[0,1,0],   p:[0,-CUBE_HALF,0]}
    ];

    function setStatus(message, submessage) {
      status.textContent = message;
      if (submessage !== undefined) detail.textContent = submessage;
    }

    function dot(a,b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }

    function multiply4(a,b) {
      const out = Array.from({length:4}, () => [0,0,0,0]);
      for (let row=0; row<4; row++) for (let col=0; col<4; col++) {
        out[row][col] = a[row][0]*b[0][col] + a[row][1]*b[1][col] + a[row][2]*b[2][col] + a[row][3]*b[3][col];
      }
      return out;
    }

    function tagToCubeMatrix(face) {
      return [
        [face.x[0], face.x[1], face.x[2], -dot(face.x, face.p)],
        [face.y[0], face.y[1], face.y[2], -dot(face.y, face.p)],
        [face.z[0], face.z[1], face.z[2], -dot(face.z, face.p)],
        [0, 0, 0, 1]
      ];
    }

    function aprilPoseToThreeMatrix(detection) {
      const pose = detection.pose;
      if (!pose || !Array.isArray(pose.R) || !Array.isArray(pose.t)) return null;
      const columns = pose.R;
      // The WASM wrapper returns R column-major in the JSON arrays.
      const cvTag = [
        [columns[0][0], columns[1][0], columns[2][0], pose.t[0]],
        [columns[0][1], columns[1][1], columns[2][1], pose.t[1]],
        [columns[0][2], columns[1][2], columns[2][2], pose.t[2]],
        [0, 0, 0, 1]
      ];
      const face = faceTransforms[detection.id];
      if (!face) return null;
      const cvCube = multiply4(cvTag, tagToCubeMatrix(face));
      // AprilTag uses OpenCV camera coordinates (x right, y down, z forward).
      // Three.js uses (x right, y up, z toward the viewer), so flip y and z.
      cvCube[1][0] *= -1; cvCube[1][1] *= -1; cvCube[1][2] *= -1; cvCube[1][3] *= -1;
      cvCube[2][0] *= -1; cvCube[2][1] *= -1; cvCube[2][2] *= -1; cvCube[2][3] *= -1;
      return new THREE.Matrix4().set(
        cvCube[0][0], cvCube[0][1], cvCube[0][2], cvCube[0][3],
        cvCube[1][0], cvCube[1][1], cvCube[1][2], cvCube[1][3],
        cvCube[2][0], cvCube[2][1], cvCube[2][2], cvCube[2][3],
        cvCube[3][0], cvCube[3][1], cvCube[3][2], cvCube[3][3]
      );
    }

    function polygonArea(corners) {
      if (!Array.isArray(corners) || corners.length < 4) return 0;
      let area = 0;
      for (let i=0; i<corners.length; i++) {
        const a = corners[i];
        const b = corners[(i+1) % corners.length];
        area += a.x*b.y - b.x*a.y;
      }
      return Math.abs(area) * 0.5;
    }

    function candidateFromDetection(detection) {
      if (!TAG_IDS.has(detection.id)) return null;
      const matrix = aprilPoseToThreeMatrix(detection);
      if (!matrix) return null;
      const position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      matrix.decompose(position, quaternion, scale);
      if (!Number.isFinite(position.z) || position.z >= 0) return null;
      const area = polygonArea(detection.corners);
      const error = Number(detection.pose.e) || 0;
      const weight = Math.max(1, Math.sqrt(area)) / (1 + error * 1500);
      return {matrix, position, quaternion, weight};
    }

    function angleBetween(a,b) {
      return 2 * Math.acos(Math.min(1, Math.abs(a.dot(b))));
    }

    function fuseCandidates(candidates) {
      if (!candidates.length) return null;
      let anchor = candidates[0];
      if (filterStarted) {
        anchor = candidates.reduce((best, item) => {
          const bestScore = best.position.distanceTo(filteredPosition) - best.weight * 0.00001;
          const itemScore = item.position.distanceTo(filteredPosition) - item.weight * 0.00001;
          return itemScore < bestScore ? item : best;
        }, candidates[0]);
      }
      const resultPosition = anchor.position.clone();
      const resultQuaternion = anchor.quaternion.clone();
      let totalWeight = anchor.weight;
      for (const candidate of candidates) {
        if (candidate === anchor) continue;
        const distance = candidate.position.distanceTo(anchor.position);
        const angle = angleBetween(candidate.quaternion, anchor.quaternion);
        if (filterStarted && (distance > 0.18 || angle > Math.PI * 0.70)) continue;
        const weight = candidate.weight;
        const fraction = weight / (totalWeight + weight);
        resultPosition.lerp(candidate.position, fraction);
        const q = candidate.quaternion.clone();
        if (resultQuaternion.dot(q) < 0) q.multiplyScalar(-1);
        resultQuaternion.slerp(q, fraction);
        totalWeight += weight;
      }
      return {position:resultPosition, quaternion:resultQuaternion.normalize()};
    }

    function applyPose(pose, visibleCount) {
      const now = performance.now();
      const dt = Math.min(0.12, Math.max(0.008, (now - lastFrameAt) / 1000));
      lastFrameAt = now;
      if (!filterStarted) {
        filteredPosition.copy(pose.position);
        filteredQuaternion.copy(pose.quaternion);
        filterStarted = true;
      } else {
        // A single tag is deliberately slower; two faces tighten the rigid pose.
        const timeConstant = visibleCount >= 2 ? 0.055 : 0.095;
        const alpha = 1 - Math.exp(-dt / timeConstant);
        filteredPosition.lerp(pose.position, alpha);
        filteredQuaternion.slerp(pose.quaternion, Math.min(0.42, alpha * 0.82));
      }
      cubeRoot.position.copy(filteredPosition);
      cubeRoot.quaternion.copy(filteredQuaternion);
      cubeRoot.visible = true;
      lastSeenAt = now;
      lastVisibleCount = visibleCount;
    }

    function handleDetections(detections) {
      const candidates = (detections || []).map(candidateFromDetection).filter(Boolean);
      updateModelScale(candidates);
      const fused = fuseCandidates(candidates);
      if (fused) {
        applyPose(fused, candidates.length);
        const label = candidates.length > 1 ? `${candidates.length} caras reconocidas; pose combinada y estabilizada.` : "1 cara reconocida; pose estabilizada.";
        setStatus(label, `Modelo: ${MODEL_NAME}`);
      } else if (filterStarted && performance.now() - lastSeenAt < HOLD_MS) {
        cubeRoot.visible = true;
        setStatus("Manteniendo la última posición durante una pérdida breve…", "Vuelve a mostrar una cara del cubo para continuar.");
      } else {
        cubeRoot.visible = false;
        setStatus("Apunta al cubo para reconocer una cara.", `Modelo: ${MODEL_NAME}`);
      }
    }

    function updateProjection(width, height) {
      if (!width || !height) return;
      const fx = width * 0.90;
      const fy = fx;
      const cx = width * 0.5;
      const cy = height * 0.5;
      const near = 0.001;
      const far = 100;
      camera.projectionMatrix.set(
        2*fx/width, 0, 1 - 2*cx/width, 0,
        0, 2*fy/height, 2*cy/height - 1, 0,
        0, 0, -(far+near)/(far-near), -2*far*near/(far-near),
        0, 0, -1, 0
      );
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      renderer.setSize(width, height, false);
    }

    async function initDetector(width, height) {
      const Detector = Comlink.wrap(new Worker("../../apriltag-worker.js"));
      let readyResolve;
      const ready = new Promise(resolve => { readyResolve = resolve; });
      detector = await new Detector(Comlink.proxy(() => readyResolve()));
      await ready;
      await detector.set_camera_info(width * 0.90, width * 0.90, width * 0.5, height * 0.5);
      for (const id of TAG_IDS) await detector.set_tag_size(id, TAG_SIZE);
      await detector.set_max_detections(6);
      await detector.set_return_solutions(0);
      detectorReady = true;
    }

    async function processFrame() {
      if (!stream) return;
      if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
        requestAnimationFrame(processFrame);
        return;
      }
      if (processing || !detectorReady) {
        requestAnimationFrame(processFrame);
        return;
      }
      processing = true;
      const sourceWidth = video.videoWidth;
      const sourceHeight = video.videoHeight;
      const factor = Math.min(1, PROCESS_MAX / Math.max(sourceWidth, sourceHeight));
      const width = Math.max(320, Math.round(sourceWidth * factor));
      const height = Math.max(240, Math.round(sourceHeight * factor));
      if (processingCanvas.width !== width || processingCanvas.height !== height) {
        processingCanvas.width = width;
        processingCanvas.height = height;
        updateProjection(sourceWidth, sourceHeight);
        await detector.set_camera_info(width * 0.90, width * 0.90, width * 0.5, height * 0.5);
      }
      processingContext.drawImage(video, 0, 0, width, height);
      const pixels = processingContext.getImageData(0, 0, width, height).data;
      const gray = new Uint8Array(width * height);
      for (let i=0, p=0; i<pixels.length; i+=4, p++) {
        gray[p] = Math.round((pixels[i] * 0.299) + (pixels[i+1] * 0.587) + (pixels[i+2] * 0.114));
      }
      try {
        const detections = await detector.detect(gray, width, height);
        handleDetections(detections);
      } catch (error) {
        console.error(error);
        setStatus("No se pudo procesar la cámara.", "Recarga la página y vuelve a probar.");
      } finally {
        processing = false;
        requestAnimationFrame(processFrame);
      }
    }

    function render() {
      requestAnimationFrame(render);
      renderer.render(scene, camera);
    }

    async function startCamera() {
      startButton.disabled = true;
      setStatus("Solicitando la cámara…", "El permiso solo se usa para esta experiencia AR.");
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("Este navegador no permite cámara en esta página.");
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
        video.srcObject = stream;
        await video.play();
        updateProjection(video.videoWidth, video.videoHeight);
        await initDetector(video.videoWidth, video.videoHeight);
        loading.hidden = true;
        startButton.style.display = "none";
        setStatus("Apunta al cubo para reconocer una cara.", `Modelo: ${MODEL_NAME}`);
        requestAnimationFrame(processFrame);
      } catch (error) {
        console.error(error);
        startButton.disabled = false;
        setStatus("No se pudo activar la cámara.", "Comprueba el permiso del navegador y vuelve a intentarlo.");
      }
    }

    startButton.addEventListener("click", startCamera);
    window.addEventListener("resize", () => updateProjection(video.videoWidth, video.videoHeight));
    new THREE.GLTFLoader().load(MODEL_URL, gltf => {
      gltf.scene.scale.setScalar(MODEL_SCALE);
      const modelBounds = new THREE.Box3().setFromObject(gltf.scene);
      if (Number.isFinite(modelBounds.min.y)) gltf.scene.position.y -= modelBounds.min.y;
      gltf.scene.traverse(node => {
        if (!node.isMesh) return;
        node.frustumCulled = false;
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.filter(Boolean).forEach(material => {
          if (material.map) material.map.encoding = THREE.sRGBEncoding;
          if (material.emissiveMap) material.emissiveMap.encoding = THREE.sRGBEncoding;
          material.needsUpdate = true;
        });
      });
      modelAnchor.add(gltf.scene);
      setStatus("Modelo listo. Pulsa «Activar cámara».", `Modelo: ${MODEL_NAME}`);
    }, undefined, error => {
      console.error(error);
      setStatus("La cámara está lista, pero no se pudo cargar el modelo.", "También puedes volver a abrir la página para reintentar.");
    });
    render();
  })();
  </script>
</body>
</html>
