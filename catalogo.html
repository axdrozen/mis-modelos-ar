<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo de modelos 3D</title>
    <style>
      body { margin: 0; padding: 2rem 1rem; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
      main { max-width: 56rem; margin: auto; }
      p { color: #cbd5e1; line-height: 1.5; }
      section { display: grid; gap: 1rem; }
      article { display: flex; gap: 1rem; align-items: center; padding: 1rem; border-radius: 1rem; background: #1e293b; }
      img { width: 7rem; height: 7rem; background: white; border-radius: .5rem; }
      a { color: #fbbf24; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Catálogo de modelos 3D</h1>
      <p>Escanea un código QR o abre una experiencia para ver el modelo en realidad aumentada, sin instalar una aplicación.</p>
      <section>
        <article>
          <img src="qr-marker.png" alt="Código QR de Pretty sourdough loaf" />
          <div>
            <h2>Pretty sourdough loaf</h2>
            <p><a href="./">Abrir experiencia AR</a></p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
